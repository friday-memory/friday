[project]
name = "friday-memory"
version = "1.1.0"
description = "Self-hosted persistent cognitive memory layer for AI coding agents (MCP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Shobhit Singh", email = "itskie7910@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "cursor",
    "claude-code",
    "knowledge-graph",
    "neo4j",
    "persistent-memory"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore:.*deprecated.*:Warning",
    "ignore::DeprecationWarning"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402"]
