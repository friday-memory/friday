name: Bug Report
description: Create a report to help us improve Friday
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much context as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the unexpected behavior...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      value: |
        1. Start Friday via 'docker compose up -d'
        2. Execute MCP query with '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen under normal conditions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Environment Logs & Traceback
      description: Paste any relevant terminal logs, Docker container output, or traceback.
      render: shell
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Environment
      options:
        - Docker Compose (Localhost)
        - Docker Compose (Cloud / EC2 / VPS)
        - Native Python / Local Virtualenv
        - Other
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: AI Coding Client
      description: Cursor, Claude Code CLI, Antigravity, VS Code, Windsurf, etc.
      placeholder: e.g. Cursor 0.44 / Claude Code 1.0
